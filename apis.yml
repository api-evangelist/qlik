apis:
- aid: qlik:qlik
  name: Qlik
  description: >-
    Qlik provides APIs to support automation, configuration, observability, and integration with third-party
    applications to incorporate Qlik Cloud capabilities directly into those applications.
  humanURL: https://qlik.dev/apis/
  baseURL: https://{tenant}.{region}.qlikcloud.com/api/v1
  tags: []
  properties:
  - type: Documentation
    url: https://qlik.dev/apis/
  - type: GettingStarted
    url: https://qlik.dev/get-started
